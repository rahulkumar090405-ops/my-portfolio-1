AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AWS infrastructure for my-portfolio-1 React portfolio.
  Creates S3, CloudFront and GitHub Actions OIDC deployment role.

Parameters:

  GitHubRepository:
    Type: String
    Default: rahulkumar090405-ops/my-portfolio-1
    Description: GitHub repository in OWNER/REPOSITORY format.

Resources:

  PortfolioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "my-portfolio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PortfolioOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "my-portfolio-${AWS::AccountId}"
        Description: Access control for portfolio S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PortfolioCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3

        Origins:
          - Id: PortfolioS3Origin
            DomainName: !GetAtt PortfolioBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt PortfolioOriginAccessControl.Id

        DefaultCacheBehavior:
          TargetOriginId: PortfolioS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

        Restrictions:
          GeoRestriction:
            RestrictionType: none

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  PortfolioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortfolioBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource: !Sub "${PortfolioBucket.Arn}/*"

            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PortfolioCloudFront}"

  GitHubActionsRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: my-portfolio-GitHubActionsRole

      Description: GitHub Actions deployment role using OIDC.

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: GitHubActionsOIDC
            Effect: Allow

            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"

            Action:
              - sts:AssumeRoleWithWebIdentity

            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com

              StringLike:
                token.actions.githubusercontent.com:sub: "repo:rahulkumar090405-ops@263708646/my-portfolio-1@1393175677:ref:refs/heads/main"

      Policies:

        - PolicyName: PortfolioDeploymentPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt PortfolioBucket.Arn

              - Sid: ManageWebsiteFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "${PortfolioBucket.Arn}/*"

              - Sid: CloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PortfolioCloudFront}"

Outputs:

  PortfolioBucketName:
    Description: S3 bucket for React portfolio
    Value: !Ref PortfolioBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref PortfolioCloudFront

  CloudFrontURL:
    Description: CloudFront URL
    Value: !Sub "https://${PortfolioCloudFront.DomainName}"

  GitHubActionsRoleArn:
    Description: IAM role used by GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn

  AWSRegion:
    Description: AWS region
    Value: !Ref AWS::Region